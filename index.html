<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>videy.co - Video Ready</title>

  <style>
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #02040a;
      overflow-x: hidden;
    }

    .vl-wrap, .vl-wrap * {
      box-sizing: border-box;
    }

    .vl-wrap {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      overflow-x: hidden;
      overflow-y: auto;
      background: #02040a;
      color: #e5e7eb;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }

    .vl-wrap::before, .vl-wrap::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .55;
      pointer-events: none;
      animation: vl-float 14s ease-in-out infinite alternate;
    }
    .vl-wrap::before {
      width: 420px;
      height: 420px;
      top: -120px;
      left: -80px;
      background: #1d4ed8;
    }
    .vl-wrap::after {
      width: 360px;
      height: 360px;
      bottom: -120px;
      right: -60px;
      background: #7c3aed;
      animation-delay: -6s;
    }
    @keyframes vl-float {
      to { transform: translate(60px, 40px) scale(1.15); }
    }

    .vl-grid {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
    }

    .vl-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: auto;
      padding: 28px 20px 24px;
      text-align: center;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 24px;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
      animation: vl-in .7s ease both;
    }
    @keyframes vl-in {
      from { opacity: 0; transform: translateY(24px); }
    }

    .vl-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      padding: 6px 12px;
      border-radius: 999px;
      color: #86efac;
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.25);
    }
    .vl-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: vl-pulse 1.6s infinite;
    }
    @keyframes vl-pulse {
      0% { box-shadow: 0 0 0 0 rgba(34,197,94,.6); }
      100% { box-shadow: 0 0 0 9px rgba(34,197,94,0); }
    }

    .vl-title {
      margin: 18px 0 8px;
      font-size: clamp(32px, 10vw, 44px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -.02em;
      color: #60a5fa;
      background: linear-gradient(90deg, #60a5fa, #a78bfa, #60a5fa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: vl-shine 5s linear infinite;
      overflow-wrap: anywhere;
    }
    @keyframes vl-shine {
      to { background-position: 200% center; }
    }

    .vl-sub {
      margin: 0 auto 22px;
      width: 100%;
      max-width: 340px;
      font-size: 14px;
      line-height: 1.6;
      color: #b6bdc9;
    }
    .vl-timer {
      margin: 0 0 18px;
      font-size: 13px;
      color: #94a3b8;
      min-height: 18px;
    }
    .vl-timer b { color: #fff; }

    .vl-list {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .vl-btn {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      margin-bottom: 12px;
      padding: 15px 14px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #1f2937, #374151);
      border: 1px solid rgba(255,255,255,.1);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .vl-btn .ico { margin-right: 10px; }
    .vl-btn.primary {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-color: rgba(147,197,253,.4);
      box-shadow: 0 10px 30px rgba(37,99,235,.45);
    }
    .vl-btn:hover {
      transform: translateY(-3px);
      border-color: rgba(147,197,253,.55);
      box-shadow: 0 14px 34px rgba(59,130,246,.35);
    }
    .vl-btn:active { transform: scale(.98); }
    .vl-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 50%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent);
      transform: skewX(-20deg);
      transition: left .6s ease;
    }
    .vl-btn:hover::after { left: 130%; }
    .vl-btn .arrow { margin-left: auto; opacity: .6; transition: transform .2s; }
    .vl-btn:hover .arrow { transform: translateX(4px); opacity: 1; }
    .vl-btn.locked { pointer-events: none; opacity: .45; }

    .vl-copy {
      margin-top: 4px;
      min-height: 42px;
      padding: 10px;
      background: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      color: #8b95a7;
      text-decoration: underline;
    }
    .vl-copy:hover { color: #fff; }
    .vl-foot { margin-top: 18px; font-size: 12px; color: #667085; }

    @media screen and (max-width: 380px) {
      .vl-wrap { padding: 20px 12px; }
      .vl-card { padding: 24px 15px 20px; border-radius: 20px; }
      .vl-btn { font-size: 14px; padding: 14px 10px; }
    }

    @media screen and (max-height: 600px) {
      .vl-wrap { align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="vl-wrap">
    <div class="vl-grid"></div>
    <div class="vl-card">
      <span class="vl-badge"><span class="vl-dot"></span>Video ready to play</span>
      <h1 class="vl-title" id="vl-brand">videy.co</h1>
      <p class="vl-sub">Your video is ready to play. If one link doesn't work, try another available link below 👇</p>
      <p class="vl-timer" id="vl-timer"></p>
      <div class="vl-list" id="vl-list"></div>
      <button class="vl-copy" id="vl-copy" type="button">Copy this page link</button>
      <div class="vl-foot" id="vl-foot"></div>
    </div>
  </div>

  <script type="text/javascript">
  (function () {
    /* ================= CONFIG: EDIT DI SINI ================= */
    var BRAND     = "videy.co";
    var FOOTER    = "Powered by videy.co";
    var COUNTDOWN = 5;      // Detik sebelum link terbuka (0 = langsung aktif)
    var NEW_TAB   = true;

    // Tujuan tombol pertama (ID video ditambahkan dari ?v= di URL)
    var PLAY_BASE = "https://vidhood.github.io/x0/";

    function getVideoId() {
      var m = /[?&]v=([^&#]*)/.exec(window.location.search);
      if (!m) { return ""; }
      var v;
      try { v = decodeURIComponent(m[1]); } catch (e) { return ""; }
      return /^[A-Za-z0-9._-]+$/.test(v) ? v : "";
    }

    var vid = getVideoId();
    var playUrl = vid ? PLAY_BASE + "?v=" + encodeURIComponent(vid) : PLAY_BASE;

    var LINKS = [
      { label: "Play Video",             icon: "▶",  url: playUrl },
      { label: "Best Collection",        icon: "⭐", url: "https://hoodmedia.github.io/yourplaces/" },

    ];
    /* ======================================================== */

    function $(id) { return document.getElementById(id); }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) { e.className = cls; }
      if (text) { e.textContent = text; }
      return e;
    }

    var brandEl = $("vl-brand");
    if (!brandEl) { return; }
    brandEl.textContent = BRAND;
    $("vl-foot").textContent = FOOTER;

    var list = $("vl-list");
    var buttons = [];
    for (var i = 0; i !== LINKS.length; i++) {
      var l = LINKS[i];
      var a = el("a", i === 0 ? "vl-btn primary" : "vl-btn");
      a.href = l.url;
      a.rel = "noopener noreferrer nofollow";
      if (NEW_TAB) { a.target = "_blank"; }
      a.appendChild(el("span", "ico", l.icon));
      a.appendChild(el("span", "txt", l.label));
      a.appendChild(el("span", "arrow", "→"));
      list.appendChild(a);
      buttons.push(a);
    }

    var timer = $("vl-timer");

    function showCount(n) {
      timer.textContent = "";
      timer.appendChild(document.createTextNode("Links active in "));
      timer.appendChild(el("b", "", String(n)));
      timer.appendChild(document.createTextNode(" sec…"));
    }

    function unlock() {
      for (var k = 0; k !== buttons.length; k++) {
        buttons[k].className = buttons[k].className.replace(" locked", "");
      }
      timer.textContent = "✔ Links are active";
    }

    if (COUNTDOWN > 0) {
      for (var j = 0; j !== buttons.length; j++) {
        buttons[j].className += " locked";
      }
      var left = COUNTDOWN;
      showCount(left);
      var t = setInterval(function () {
        left = left - 1;
        if (left > 0) {
          showCount(left);
        } else {
          clearInterval(t);
          unlock();
        }
      }, 1000);
    }

    $("vl-copy").addEventListener("click", function () {
      var btn = this;
      var done = function () {
        btn.textContent = "✔ Copied!";
        setTimeout(function () { btn.textContent = "Copy this page link"; }, 1800);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(location.href).then(done);
      } else {
        var ta = document.createElement("textarea");
        ta.value = location.href;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      }
    });
  })();
  </script>
